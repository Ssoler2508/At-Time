<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="1440" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="400" fill="#FFF4E6"/>

  <!-- Logotipo: pin de ubicación con reloj -->
  <g transform="translate(40,30)">
    <path d="M110 20 C70 20 40 52 40 92 C40 140 110 205 110 205 C110 205 180 140 180 92 C180 52 150 20 110 20 Z" fill="#F26B38"/>
    <circle cx="110" cy="92" r="42" fill="#FFF4E6"/>
    <line x1="110" y1="92" x2="110" y2="64" stroke="#14323F" stroke-width="7" stroke-linecap="round"/>
    <line x1="110" y1="92" x2="132" y2="104" stroke="#14323F" stroke-width="7" stroke-linecap="round"/>
    <circle cx="110" cy="92" r="6" fill="#14323F"/>
  </g>

  <!-- Nombre -->
  <text x="235" y="140" font-family="Nunito, Poppins, 'Arial Rounded MT Bold', Arial, sans-serif" font-size="92" font-weight="800" fill="#14323F">At <tspan fill="#F26B38">Time</tspan></text>
  <text x="238" y="182" font-family="Nunito, Poppins, Arial, sans-serif" font-size="25" font-weight="600" fill="#14323F" fill-opacity="0.78">Lo bueno de tu barrio, a tiempo</text>

  <!-- Paleta -->
  <g font-family="Nunito, Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="265" width="140" height="70" rx="12" fill="#F26B38"/>
    <text x="110" y="357" fill="#14323F">Naranja #F26B38</text>

    <rect x="200" y="265" width="140" height="70" rx="12" fill="#14323F"/>
    <text x="270" y="357" fill="#14323F">Azul #14323F</text>

    <rect x="360" y="265" width="140" height="70" rx="12" fill="#FFC857"/>
    <text x="430" y="357" fill="#14323F">Amarillo #FFC857</text>

    <rect x="520" y="265" width="140" height="70" rx="12" fill="#FFF4E6" stroke="#14323F" stroke-opacity="0.25" stroke-width="2"/>
    <text x="590" y="357" fill="#14323F">Crema #FFF4E6</text>
  </g>
